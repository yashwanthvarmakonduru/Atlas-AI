name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    # the tests run against a real MongoDB with Atlas Search, Redis and an S3 server, exactly like local development
    services:
      # Atlas Local: MongoDB with Atlas Search and Vector Search, which the retrieval tests need
      mongodb:
        image: mongodb/mongodb-atlas-local:latest
        ports: ['27017:27017']
      redis:
        image: redis:8
        ports: ['6379:6379']
      s3:
        image: adobe/s3mock
        ports: ['9090:9090']
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: atlas-test
    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:9090
      MONGODB_TEST_URL: mongodb://127.0.0.1:27017
      SEARCH_TEST_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Type check (strict)
        run: npm run typecheck
      - name: Tests with coverage
        run: npm run test:coverage
      # the same in-process embedding model the deployment uses, fetched once and kept between runs
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/atlas-models
          key: models-bge-small-en-v1.5-q8
      - name: Evaluation gate (retrieval quality, citations, tenant isolation)
        run: npm run check -w @atlas/eval
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
          EMBEDDING_PROVIDER: local
          EMBEDDING_DIMENSIONS: '384'
          MODEL_CACHE_DIR: /home/runner/.cache/atlas-models
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # the JavaScript the browser downloads has a size budget, so a heavy dependency fails the pull request
      - name: Bundle budget
        run: npm run size -w @atlas/web

  e2e:
    name: End to end, accessibility, Lighthouse
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # builds the three images, which is also the check that they build, then runs the whole app in them
      - name: Start the app in containers
        env:
          RATE_LIMIT_SCALE: '1'
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          # --wait returns once every service with a health check is healthy, so the web app is up before the tests run
          docker compose --profile app up --build -d --wait
      - name: Playwright, against the containers
        run: npm run e2e
      - name: Lighthouse budgets
        run: npm run lighthouse
      - name: Logs from the containers, if anything failed
        if: failure()
        run: docker compose --profile app logs --no-color --tail 200
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
